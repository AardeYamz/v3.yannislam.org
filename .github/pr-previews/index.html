<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>PR previews</title>
<!-- Template for the prs.yannislam.org root page; pr-previews.yml replaces the THEME and ITEMS placeholders below (the theme version pinned in theme.json; one li per live preview). -->
<link rel="stylesheet" href="https://theme.yannislam.org/{{THEME}}/yl-theme.css">
<script src="https://theme.yannislam.org/{{THEME}}/yl-theme.js" defer></script>
<style>
  body { margin: 0; padding-inline: var(--yl-gutter, 1.25rem); line-height: 1.5; }
  main { max-width: 40rem; padding-block: 1rem 4rem; }
  small { font-family: var(--yl-mono, monospace); }
  a { color: var(--md-sys-color-primary, inherit); }
</style>
<header class="yl-head sticky">
  <a class="yl-brand" href="https://yannislam.org" aria-label="Yannis Lam, home" data-yl-logo></a>
  <h1 class="yl-title">PR previews</h1>
  <button type="button" class="yl-theme-toggle" data-yl-theme-toggle></button>
</header>
<main>
  <h2 class="yl-section-title">Open pull requests</h2>
  <ul>
{{ITEMS}}
  </ul>
</main>
