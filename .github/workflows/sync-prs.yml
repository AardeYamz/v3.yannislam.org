name: Merge main into PRs

# After every push to main, merges main into each open PR branch that is behind it, using the shared workflow in
# AardeYamz/workflows (see its header: conflict comments, skipped fork, Dependabot and workflow-change merges).
# A push made with GITHUB_TOKEN does not trigger pull_request workflows, so the new head would sit with no checks. The
# exception is workflow_dispatch, which this token may send and which reports its checks on the branch head (and so on
# the PR), so the template re-runs Build & Test and CI on each branch it updates. The dispatched run skips
# dependency-review, which is pull_request-only; the merge only adds what main has.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-prs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    permissions:
      contents: write       # pushes the merge commit to the PR branch
      pull-requests: write  # comments on a PR that conflicts
      actions: write        # dispatches CI on a branch it just updated
    uses: AardeYamz/workflows/.github/workflows/sync-prs.yml@3f1c44d370d79f186604657b5ddc3155a95a5433 # v1.3.0
    with:
      dispatch-workflows: build-test.yml ci.yml
