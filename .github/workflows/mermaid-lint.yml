name: Mermaid lint

# Parses every mermaid code block in the repo's Markdown files (tools/mermaid-lint). Run locally: see CLAUDE.md.
on:
  push:
    branches: [main]
    paths: ['**/*.md', 'tools/mermaid-lint/**', '.github/workflows/mermaid-lint.yml']
  pull_request:
    paths: ['**/*.md', 'tools/mermaid-lint/**', '.github/workflows/mermaid-lint.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mermaid:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tools/mermaid-lint/package-lock.json
      - run: npm ci --prefix tools/mermaid-lint
      - run: node tools/mermaid-lint/lint.mjs
