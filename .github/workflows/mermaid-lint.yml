name: Mermaid lint

# Parses every mermaid code block in the repo's Markdown files, using the shared linter in cloudflare-workers-devops. Run locally: see CLAUDE.md.
on:
  push:
    branches: [main]
    paths: ['**/*.md', '.github/workflows/mermaid-lint.yml']
  pull_request:
    paths: ['**/*.md', '.github/workflows/mermaid-lint.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mermaid:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: AardeYamz/cloudflare-workers-devops/mermaid-lint@v1
