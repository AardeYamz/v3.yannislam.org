name: Security

# Static analysis of the workflow files themselves. Dependency triage is
# handled by Dependabot plus Aikido's dashboard-side PR gating (GitHub App),
# which needs no CI secret and no job here.

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
  schedule:
    # Mondays, 06:30 UTC — after Dependabot's 06:00 window, so the weekly
    # scan sees whatever it just opened.
    - cron: '30 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Scoped to PRs: cancelling an in-progress push-to-main run would leave
  # main without a green run of its own if two merges land close together.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lints the workflow files themselves — template injection,
  # credential persistence, overscoped tokens, unpinned actions, cache
  # poisoning, impostor commits. Catches regressions in §3.1-3.4 of
  # docs/todo/github-actions-speed-and-hardening.md automatically instead of
  # relying on the next manual audit.
  zizmor:
    name: Lint workflows (zizmor)
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
