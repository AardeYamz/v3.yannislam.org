name: Security

# Static analysis of the workflow files themselves. Dependency triage is
# handled by Dependabot plus Aikido's dashboard-side PR gating (GitHub App),
# which needs no CI secret and no job here.

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
  schedule:
    # Mondays, 06:30 UTC — after Dependabot's 06:00 window, so the weekly
    # scan sees whatever it just opened.
    - cron: '30 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Scoped to PRs: cancelling an in-progress push-to-main run would leave
  # main without a green run of its own if two merges land close together.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lints the workflow files themselves (template injection, credential persistence, overscoped tokens, unpinned
  # actions, cache poisoning, impostor commits) with the shared template in personal-domain-devops. Catches regressions
  # in §3.1-3.4 of docs/todo/github-actions-speed-and-hardening.md automatically instead of relying on the next manual
  # audit.
  zizmor:
    permissions:
      contents: read
      security-events: write   # uploads the SARIF to code scanning
      actions: read            # lets the upload read this run's metadata
    uses: AardeYamz/personal-domain-devops/.github/workflows/reusable-zizmor.yml@d340094162e5b47e29a3de3318a7af5829d65775 # personal-domain-devops#37
