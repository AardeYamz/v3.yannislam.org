name: CodeQL

# Free static analysis for public repos, filling the one gap Dependabot and
# Aikido (security.yml) don't cover: both look at *dependencies*, nothing
# looks at src/ itself.
#
# Report-only for now (see docs/todo/github-actions-speed-and-hardening.md
# §8 open decision 3): findings surface in the Security tab rather than
# failing the build, until the baseline on this animation-heavy codebase
# (anime.js, a RAF loop) is known to be clean.

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  schedule:
    # Mondays, 07:00 UTC — same slot as the build-test.yml full-matrix run.
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:javascript-typescript
