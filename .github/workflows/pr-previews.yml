name: PR previews

# Builds the previews that pr-previews-deploy.yml publishes at https://v3.yannislam.org/pr-<number>/ (e.g. /pr-12/): each open
# PR once per commit, kept as artifact pr-<n>-<sha>, then dispatches the deploy. Shared logic: AardeYamz/workflows
# preview-build.yml (see docs/changes/*-shared-preview-workflows.md). Vercel's own per-branch preview URLs stay as they are.
#
# pull_request only, on purpose. A push or workflow_dispatch run can write the default branch's Actions cache, and this builds
# other people's PR code (CodeQL: actions/cache-poisoning). When sync-prs.yml merges main into the PR branches, each push starts
# a run here that GitHub holds as "action_required" until someone approves it; until then the PR's preview stays at its
# previous build. VERCEL is unset in the build, so inject-env.js writes the inert GA placeholder.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: pr-previews-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  previews:
    permissions:
      contents: read
      pull-requests: read
      actions: write   # lists runs and artifacts; dispatches pr-previews-deploy.yml
    uses: AardeYamz/workflows/.github/workflows/preview-build.yml@0bd932fd360647971c045606af91173468a16fe4 # v1.1.2
    with:
      runs-on: ubuntu-26.04
      node-version: 24
      install: npm ci --no-audit --no-fund --prefer-offline
      build: npm run build -- --base-href "/pr-{n}/"
      output: dist/v3.yannislam.org/browser
      deploy-workflow: pr-previews-deploy.yml
