name: Build & Test

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Mondays, 07:00 UTC — full browser matrix plus the external-link checks
    # in footer-and-links.spec.ts that are excluded from PR runs.
    - cron: '0 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache Angular build artifacts
        uses: actions/cache@v6
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-angular-

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage/v3.yannislam.org/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Cache Angular build artifacts
        uses: actions/cache@v6
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-angular-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful! Dist directory size:"
          du -sh dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Runs in parallel with e2e off the same dist artifact, so it adds nothing
  # to the critical path (e2e is ~6min, this is ~4min). Never rebuilds.
  #
  # Scope: this catches regressions in what the repo controls — bundle size,
  # render-blocking resources, accessibility, SEO, layout stability. It is
  # explicitly NOT a proxy for production field data; see the header comment
  # in lighthouserc.js and docs/todo/desktop-performance.md.
  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately. Desktop matches the field metric currently
        # tracked in docs/todo/desktop-performance.md; mobile applies
        # Lighthouse's default slow-4G + 4x-CPU throttling and is the only
        # one of the two that reproduces the real layout shift.
        preset: [mobile, desktop]

    env:
      LH_PRESET: ${{ matrix.preset }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI
        run: npx lhci autorun --config=./lighthouserc.js

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report-${{ matrix.preset }}
          path: lhci-report/
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    env:
      CI: true
      # Full 4-browser matrix on push-to-main and the nightly schedule;
      # Chromium + mobile only on PRs to keep wall clock down.
      PLAYWRIGHT_FULL_MATRIX: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && '1' || '0' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # @external-tagged tests HEAD third-party URLs (social profiles, design
      # credits). A site being down or rate-limiting CI egress is not a
      # regression here, so they run on the weekly schedule only and can
      # never redden a pull request.
      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }}/2 ${{ github.event_name == 'schedule' && ' ' || '--grep-invert @external' }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            blob-report/
          retention-days: 7
