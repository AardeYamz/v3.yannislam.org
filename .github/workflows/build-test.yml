name: Build & Test

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Mondays, 07:00 UTC — full browser matrix plus the external-link checks
    # in footer-and-links.spec.ts that are excluded from PR runs.
    - cron: '0 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Scoped to PRs: cancelling an in-progress push-to-main run would leave
  # main without a green run of its own if two merges land close together.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No job here writes to the repo; the e2e and unit-tests jobs run several
# hundred npm packages' worth of install scripts and test code, so the
# default token is scoped to read-only rather than inheriting the repo
# default (read/write on all scopes for older repos).
permissions:
  contents: read

# Six jobs each run `npm ci`. The audit and fund requests are a network round
# trip per install that CI never reads (dependency-review and Dependabot cover
# advisories), and --prefer-offline lets the setup-node npm cache serve
# packages without revalidating each one against the registry.
env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_PREFER_OFFLINE: 'true'

jobs:
  unit-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache Angular build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-angular-

      # Vercel builds with npm 12, which warns about install scripts that
      # aren't covered by allowScripts; match it so those warnings (and any
      # npm-12-only failures) show up here too.
      - name: Install npm 12
        run: npm install --global npm@12.2.1 # zizmor: ignore[adhoc-packages] npm is the package manager itself, so no lockfile can supply it; exact version pinned

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Run build script tests
        run: npm run test:scripts

      # Both matrix legs produce identical coverage; uploading from both
      # doubles the Codecov report for no benefit, so only the primary
      # version reports.
      - name: Upload coverage reports
        if: matrix.node-version == '24.x'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/v3.yannislam.org/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Cache Angular build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-angular-

      # Vercel builds with npm 12, which warns about install scripts that
      # aren't covered by allowScripts; match it so those warnings (and any
      # npm-12-only failures) show up here too.
      - name: Install npm 12
        run: npm install --global npm@12.2.1 # zizmor: ignore[adhoc-packages] npm is the package manager itself, so no lockfile can supply it; exact version pinned

      - name: Install dependencies
        run: npm ci

      # tee keeps the full log in the job output; pipefail (implied by an
      # explicit `shell: bash`) keeps a failed build failing the step.
      - name: Build project
        shell: bash
        run: npm run build 2>&1 | tee build.log

      # Strip colour codes, keep only warning/error lines, and cap the size
      # (a PR comment tops out at 65,536 characters).
      - name: Collect build warnings
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build.log \
            | grep -E 'WARNING|ERROR|npm warn' \
            | head -c 60000 > build-warnings.txt || true

      - name: Upload build warnings
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-warnings
          path: build-warnings.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: Check build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful! Dist directory size:"
          du -sh dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Posts the build step's warnings/errors as one sticky PR comment, edited in
  # place on every push. Kept out of the `build` job so that job (which runs
  # npm install scripts) never holds a write token. Skipped for fork and
  # Dependabot PRs, whose GITHUB_TOKEN is read-only.
  build-warnings-comment:
    needs: build
    if: >-
      always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions:
      pull-requests: write

    steps:
      - name: Download build warnings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-warnings
        continue-on-error: true

      - name: Create or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          marker='<!-- build-warnings-comment -->'
          {
            echo "$marker"
            echo '### Build warnings'
            echo
            if [ -s build-warnings.txt ]; then
              echo "Build \`$BUILD_RESULT\` at \`${SHA:0:7}\`. Lines from \`npm run build\` matching \`WARNING\`, \`ERROR\` or \`npm warn\`:"
              echo
              echo '```'
              cat build-warnings.txt
              echo '```'
            else
              echo "Build \`$BUILD_RESULT\` at \`${SHA:0:7}\`: no warnings or errors."
            fi
          } > body.md
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | select(.body | contains(\"$marker\"))][0].id // empty" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
          fi

  # Runs in parallel with e2e off the same dist artifact, so it adds nothing
  # to the critical path (e2e is ~6min, this is ~4min). Never rebuilds.
  #
  # Scope: this catches regressions in what the repo controls — bundle size,
  # render-blocking resources, accessibility, SEO, layout stability. It is
  # explicitly NOT a proxy for production field data; see the header comment
  # in lighthouserc.js and docs/todo/desktop-performance.md.
  lighthouse:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately. Desktop matches the field metric currently
        # tracked in docs/todo/desktop-performance.md; mobile applies
        # Lighthouse's default slow-4G + 4x-CPU throttling and is the only
        # one of the two that reproduces the real layout shift.
        preset: [mobile, desktop]

    env:
      LH_PRESET: ${{ matrix.preset }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'npm'

      # Vercel builds with npm 12, which warns about install scripts that
      # aren't covered by allowScripts; match it so those warnings (and any
      # npm-12-only failures) show up here too.
      - name: Install npm 12
        run: npm install --global npm@12.2.1 # zizmor: ignore[adhoc-packages] npm is the package manager itself, so no lockfile can supply it; exact version pinned

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI
        run: npx lhci autorun --config=./lighthouserc.js

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report-${{ matrix.preset }}
          path: lhci-report/
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    env:
      CI: true
      # Full 4-browser matrix on push-to-main and the nightly schedule;
      # Chromium + mobile only on PRs to keep wall clock down.
      PLAYWRIGHT_FULL_MATRIX: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && '1' || '0' }}
      # Keep in sync with the `fullMatrix` branch in playwright.config.ts —
      # they are two expressions of the same decision. `mobile` is a
      # `devices['Pixel 7']` chromium context, so it never needs its own
      # browser binary.
      PW_BROWSERS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'chromium firefox webkit' || 'chromium' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'npm'

      # Vercel builds with npm 12, which warns about install scripts that
      # aren't covered by allowScripts; match it so those warnings (and any
      # npm-12-only failures) show up here too.
      - name: Install npm 12
        run: npm install --global npm@12.2.1 # zizmor: ignore[adhoc-packages] npm is the package manager itself, so no lockfile can supply it; exact version pinned

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          # Shard is part of the key so the two matrix legs never race to
          # reserve the same cache entry (previously: "Unable to reserve
          # cache ... another job may be creating this cache").
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-${{ env.PW_BROWSERS }}-${{ matrix.shard }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        # $PW_BROWSERS via plain shell expansion, not ${{ env.PW_BROWSERS }}
        # template interpolation — the latter pastes the value into the
        # script text before the shell ever sees it (zizmor: template-injection).
        run: npx playwright install --with-deps $PW_BROWSERS

      # On a cache hit the binaries are restored but the apt packages
      # (`--with-deps`) are not persisted by actions/cache; this is the
      # cheap half of the install and takes ~10s rather than ~60s.
      - name: Install system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps $PW_BROWSERS

      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # @external-tagged tests HEAD third-party URLs (social profiles, design
      # credits). A site being down or rate-limiting CI egress is not a
      # regression here, so they run on the weekly schedule only and can
      # never redden a pull request.
      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }}/2 ${{ github.event_name == 'schedule' && ' ' || '--grep-invert @external' }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            blob-report/
          retention-days: 7

  # Diffs the lockfile on every PR and fails on a newly-introduced
  # known-vulnerable or disallowed-license package, before it merges.
  # Complements Dependabot (reactive: opens a PR after an advisory exists)
  # and Aikido (dashboard PR gating, reachability triage) rather than duplicating
  # either.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
