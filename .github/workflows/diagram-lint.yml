name: Diagram lint

# Lints every mermaid block in the repo's Markdown, and every .d2 file and d2 block, with the shared workflow in
# AardeYamz/workflows. Run locally: see CLAUDE.md.
on:
  push:
    branches: [main]
    paths: ['**/*.md', '**/*.d2', '.github/workflows/diagram-lint.yml']
  pull_request:
    paths: ['**/*.md', '**/*.d2', '.github/workflows/diagram-lint.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagrams:
    uses: AardeYamz/workflows/.github/workflows/diagram-lint.yml@0bd932fd360647971c045606af91173468a16fe4 # v1.1.2
    with:
      d2: true
