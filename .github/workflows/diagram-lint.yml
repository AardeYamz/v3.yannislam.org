name: Diagram lint

# Lints every mermaid block in the repo's Markdown, and every .d2 file and d2 block, with the shared workflow in
# AardeYamz/workflows. Run locally: see CLAUDE.md.
on:
  push:
    branches: [main]
    paths: ['**/*.md', '**/*.d2', '.github/workflows/diagram-lint.yml']
  pull_request:
    paths: ['**/*.md', '**/*.d2', '.github/workflows/diagram-lint.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagrams:
    uses: AardeYamz/workflows/.github/workflows/diagram-lint.yml@fb34c430ca68e310d24b586534003a47643d4b07 # v1.1.0
    with:
      d2: true
