<div class="loading-screen" [class.loading-screen--hidden]="hidden" #overlay>
    <div class="loading-screen__inner">
        <svg #logoSvg class="loading-screen__logo" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
            <g #logoGroup class="loading-screen__logo-group">
                @for (piece of pieces; track piece.name) {
                    <polygon class="logo-piece" [attr.fill]="pieceFill(piece.fill)" [attr.points]="piece.points" />
                }
            </g>
        </svg>
    </div>
</div>
