<nav [@animateMenu] class="navbar main-navbar on-top" [class.nav-shadow]='this.pageYPosition>0' [attr.aria-label]="ui.primaryNavLabel">
  <div class="container">
    <a class="navbar-brand text-light" [routerLink]="'/'" [attr.aria-label]="ui.homeAriaLabel">
      <img [src]="'assets/images/logos/' + themeService.logoVariant() + '.svg'" width="55" [alt]="ui.logoAlt"
        [style.transform]="'rotate(' + logoRotationDeg + 'deg)'" />
    </a>
    <div class="nav-right">
      <ul class="menu-ul nav">
        @for (menuItem of menu ; track menuItem; let i = $index) {
          <li class="nav-item" (click)='analyticsService.sendAnalyticEvent("click_nav", "menu", menuItem.navTitle)'>
            <a class="nav-link" [attr.href]="menuItem.siteLocation" (click)='navigate(menuItem, $event)'
              [class.nav-link-active]="!!menuItem.scrollSection && activeSection() === menuItem.scrollSection">
              @if (menuItem.navNumber) {
                <span class='nav-number'>{{menuItem.navNumber}}</span>
              }
              <span class="nav-text">{{menuItem.navTitle}}</span></a>
        </li>
      }

      </ul>
      <button type="button" class="theme-toggle" (click)="toggleTheme()" [title]="ui.themeToggleTitle"
        [attr.aria-label]="themeAriaLabel()">
        <app-icon [name]="themeService.mode() === 'default' ? 'fa-circle-half-stroke' : (themeService.mode() === 'light' ? 'fa-sun' : 'fa-moon')"></app-icon>
      </button>
      <button type="button" class="lang-toggle" (click)="toggleLanguage()" [attr.aria-label]="ui.languageAriaLabel" [title]="ui.languageAriaLabel">
        <!-- Shows the flag of the language the button switches to. -->
        @if (languageService.language() === 'en') {
          <svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#de2910"/><polygon fill="#ffde00" points="5,2 6.18,5.62 10,5.62 6.91,7.88 8.09,11.5 5,9.26 1.91,11.5 3.09,7.88 0,5.62 3.82,5.62" transform="translate(1.5 0) scale(.9)"/><g fill="#ffde00"><polygon points="10,1.5 10.4,2.7 11.7,2.7 10.7,3.4 11,4.6 10,3.9 9,4.6 9.3,3.4 8.3,2.7 9.6,2.7" transform="rotate(20 10 3)"/><polygon points="12,4 12.4,5.2 13.7,5.2 12.7,5.9 13,7.1 12,6.4 11,7.1 11.3,5.9 10.3,5.2 11.6,5.2" transform="rotate(45 12 5.5)"/><polygon points="12,8 12.4,9.2 13.7,9.2 12.7,9.9 13,11.1 12,10.4 11,11.1 11.3,9.9 10.3,9.2 11.6,9.2" transform="rotate(10 12 9.5)"/><polygon points="10,10.5 10.4,11.7 11.7,11.7 10.7,12.4 11,13.6 10,12.9 9,13.6 9.3,12.4 8.3,11.7 9.6,11.7" transform="rotate(30 10 12)"/></g></svg>
        } @else {
          <svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><rect y="0.00" width="30" height="1.54" fill="#b22234"/><rect y="3.08" width="30" height="1.54" fill="#b22234"/><rect y="6.15" width="30" height="1.54" fill="#b22234"/><rect y="9.23" width="30" height="1.54" fill="#b22234"/><rect y="12.31" width="30" height="1.54" fill="#b22234"/><rect y="15.38" width="30" height="1.54" fill="#b22234"/><rect y="18.46" width="30" height="1.54" fill="#b22234"/><rect width="12" height="10.77" fill="#3c3b6e"/></svg>
        }
      </button>
    </div>
    <button type="button" class="menu-toggle" (click)="responsiveMenuVisible = !responsiveMenuVisible"
      [attr.aria-label]="responsiveMenuVisible ? ui.closeMenu : ui.openMenu"
      [attr.aria-expanded]="responsiveMenuVisible" aria-controls="mobile-menu">
      <app-icon [name]="responsiveMenuVisible ? 'fa-xmark' : 'fa-bars'"></app-icon>
    </button>
    <div class="menu-responsive" [ngStyle]="{'pointer-events': !responsiveMenuVisible ? 'none' : '' }"
      (click)="onBackdropClick($event)">
      <aside id="mobile-menu" [class.aside-show]='responsiveMenuVisible' [class.nav-shadow]='this.pageYPosition>0' class="on-top"
        [attr.inert]="responsiveMenuVisible ? null : ''">
        <nav [attr.aria-label]="ui.mobileNavLabel">
          <ol>
            @for (menuItem of menu ; track menuItem; let i = $index) {
              <li
                (click)='analyticsService.sendAnalyticEvent("click_nav", "menu", menuItem.navTitle)'>
                <a [attr.href]="menuItem.siteLocation" (click)='navigate(menuItem, $event)'
                  [class.nav-link-active]="!!menuItem.scrollSection && activeSection() === menuItem.scrollSection">
                  @if (menuItem.navNumber) {
                    <span>{{menuItem.navNumber}}</span>
                  }
                  {{menuItem.navTitle}}
                </a>
              </li>
            }
          </ol>
        </nav>
      </aside>
    </div>
  </div>
</nav>
