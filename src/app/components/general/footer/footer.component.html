<footer>

      @for (social of socials ; track social; let i = $index) {
        <li>
          <a href={{social.url}} target='_blank'>
            <i class="fab {{social.icon}}"></i>
          </a>
        </li>
      }
    </ul>
    <div class="footer-right-bar d-none d-md-block">
      <a href={{email.url}} target='_blank'>{{email.handle}}</a>
    </div>
  </div>

  date:'yyyy'}}</div>

  rel="nofollow noopener noreferrer">Angular</a></div>
