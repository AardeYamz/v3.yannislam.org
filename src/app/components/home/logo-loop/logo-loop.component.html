<!-- Decorative, desktop only (hidden below 992px in the SCSS, where the
     falling logos stay). Every piece draws its outline, fills, holds and
     fades in a CSS loop, staggered along the top-left -> bottom-right sweep.
     Hovering a piece keeps it solid and grows it; scrolling to About dissolves
     the whole mark into small logos. -->
<svg class="logo-loop" viewBox="274 68 340 676" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  @for (piece of pieces; track piece.index) {
    <g class="logo-loop__piece" [class.logo-loop__piece--burst]="dissolved()">
      <polygon class="logo-loop__shape"
               [attr.points]="piece.points"
               [attr.fill]="pieceFill(piece)"
               [attr.stroke]="pieceFill(piece)"
               [style.--i]="piece.rank"
               pathLength="1" />
    </g>
    @for (mini of bursts()[piece.index] ?? []; track $index) {
      <image class="logo-loop__mini"
             [attr.href]="miniSrc()"
             [attr.x]="mini.x" [attr.y]="mini.y"
             [attr.width]="mini.size" [attr.height]="mini.size"
             [style.--dx.px]="mini.dx" [style.--dy.px]="mini.dy"
             [style.--rot.deg]="mini.rotation"
             [style.animation-delay.ms]="mini.delayMs" />
    }
  }
</svg>
