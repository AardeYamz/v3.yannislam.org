<section class="section banner" id="banner">
  <!-- generateLogos() calls Math.random() to pick each logo's count, variant,
       size, and opacity - server and client independently produce different
       output, which is a guaranteed hydration mismatch for this purely
       decorative (aria-hidden), non-interactive-content element. Skipping
       hydration for it lets the client do a normal, unreconciled re-render
       instead of trying (and failing) to diff mismatched nodes. -->
  <app-floating-logos ngSkipHydration></app-floating-logos>
  <div [@bannerTrigger] class="container">
    <div class="section-box-banner">
      <div class="content">
        <div>
          <h1>{{ data.banner.greeting }}</h1>
        </div>
        <div class='banner-title'>
          <h2 class="text-capitalize">{{ data.banner.name }}</h2>
          <app-typewriter [strings]="data.banner.typeSection" />
        </div>
        <div class='banner-description' appLinkPreviewDelegate>
          @for (text of this.data.banner.blurb; track text) {
            <p class="mt-4" [innerHTML]="text">
            </p>
          }
        </div>
      </div>
      <div class="div-btn-banner">
        <a (click)='analyticsService.sendAnalyticEvent("click_send_mail", "banner", "email")'
          href="mailto:email@yannislam.org" target="_black" class="main-btn text-capitalize">
          email me!
        </a>
        <button type="button" (click)='openResume()' class="main-btn text-capitalize">
          resume
        </button>
      </div>
    </div>
  </div>
</section>
