<section class="section about" id='about' [style.--bg-opacity]="bgOpacity()">
  <div class="about-bg-image"></div>
  <div class="container">
    <div class="section-box">
      <div class="about-title" data-aos="fade-up">
        <h3 class="section-title">
          <span class='n-section-title'>01.</span> {{ui.title}}
        </h3>
      </div>
      <div class="row">
        <div class="col-12 col-md-6 mb-4 mb-md-0">
          <div class="about-description">
            @for (paragraph of ui.paragraphs; track $index) {
              <p data-aos="fade-up" data-aos-duration="1000" [innerHTML]="paragraph"></p>
            }

            <ul class="skills-list" data-aos="fade-up">
              @for (skill of data?.about?.experiences?.skills ; track skill; let i = $index) {
                <li
                  class="skill-element" data-aos="fade-up" data-aos-duration="1000"><span
                class='underline'>{{skill}} </span></li>
              }
            </ul>
          </div>
        </div>
        <div class="col-12 col-md-6 mt-4 mt-md-0 text-center" data-aos="fade-up" data-aos-duration="1000">
          <div class="about-img-container">
            <picture>
              <source type="image/webp"
                srcset="assets/images/profiles/profile.webp 1x, assets/images/profiles/profile@2x.webp 2x">
              <img (click)='analyticsService.sendAnalyticEvent("click_image", "about", "image")' width="300"
                height="400" src="assets/images/profiles/profile.jpg"
                srcset="assets/images/profiles/profile.jpg 1x, assets/images/profiles/profile@2x.jpg 2x"
                [alt]="ui.imageAlt">
            </picture>
            </div>
          </div>

        </div>
      </div>
    </div>
  </section>
